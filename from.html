<!DOCTYPE html>
<html lang='ko'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>프로미스나인 별명 추천</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff5fa;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:520px;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{text-align:center;color:#ff4f93}input{width:100%;padding:14px;border:2px solid #ffd1e5;border-radius:12px;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;border:none;border-radius:12px;background:#ff4f93;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
#error{display:none;color:#d93025;text-align:center;margin-top:16px;font-weight:bold}
#result{display:none;margin-top:20px;text-align:center}.nickname{font-size:32px;font-weight:800;color:#222}
</style></head><body>
<div class='card'><h1>프로미스나인 별명 추천</h1><p>정확한 멤버명만 입력 가능합니다.</p>
<input id='nameInput' placeholder='예: 이나경'><button onclick='recommend()'>별명 추천받기</button>
<div id='error'>정확한 멤버명이 아닙니다. 다시 입력해주세요.</div>
<div id='result'><div id='memberName'></div><div id='nickname' class='nickname'></div></div></div>

function recommend(){
 const name=document.getElementById('nameInput').value.trim();
 if(!nicknames[name]){document.getElementById('error').style.display='block';document.getElementById('result').style.display='none';return;}
 document.getElementById('error').style.display='none';
 document.getElementById('result').style.display='block';
 document.getElementById('memberName').textContent=name;
 const list=nicknames[name];
 document.getElementById('nickname').textContent=list[Math.floor(Math.random()*list.length)];
}
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')recommend();});
</script></body></html>
